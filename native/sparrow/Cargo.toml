[package]
name = "animatus-nesting"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
sparrow = { path = "vendor", default-features = false }
jagua-rs = { version = "=1.0.0", features = ["spp"] }
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
